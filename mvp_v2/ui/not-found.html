<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>页面不存在 · Loomtake 脚本工作台</title>
    <style>
      :root { color-scheme: light; font-family: Arial, "PingFang SC", sans-serif; background: #f3f3f3; color: #0a0a0a; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
      main { width: min(680px, 100%); border: 1px solid #0a0a0a; background: #fff; padding: clamp(28px, 7vw, 64px); box-shadow: 12px 12px 0 #0a0a0a; }
      span { display: inline-block; margin-bottom: 20px; padding: 6px 9px; background: #0a0a0a; color: #41ff00; font: 700 12px/1 monospace; letter-spacing: .12em; }
      h1 { margin: 0; font: 700 clamp(40px, 9vw, 72px)/1.05 "Hiragino Sans GB", "PingFang SC", "Microsoft YaHei", sans-serif; }
      p { margin: 24px 0 32px; max-width: 38em; color: #555; font-size: 17px; line-height: 1.7; }
      a { display: inline-block; border: 1px solid #0a0a0a; background: #0a0a0a; color: #41ff00; padding: 12px 18px; font-weight: 700; text-decoration: none; }
      a:focus-visible { outline: 3px solid #41ff00; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <span>404 / ROUTE NOT FOUND</span>
      <h1>页面不存在</h1>
      <p>这个地址不属于当前工作台，或已经失效。请返回中控台重新选择项目。</p>
